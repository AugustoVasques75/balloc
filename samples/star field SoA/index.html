<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balloc Star Field</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="screen"></canvas>

    <script src="../../src/pt/balloc.js"></script>
    <script>

        const canvas = document.getElementById("screen");
        const ctx = canvas.getContext("2d");

        const STAR_COUNT = 512;

        const memory = new Balloc(STAR_COUNT * 4, "32u");

        const posX = memory.alloc(STAR_COUNT);
        const posY = memory.alloc(STAR_COUNT);
        const speed = memory.alloc(STAR_COUNT);
        const brightness = memory.alloc(STAR_COUNT);
        
        memory.fill(posX, 0, 0, STAR_COUNT);
        memory.fill(posY, 0, 0, STAR_COUNT);
        memory.fill(speed, 0, 0, STAR_COUNT);
        memory.fill(brightness, 0, 0, STAR_COUNT);

        let width = 0;
        let height = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            for (let i = 0; i < STAR_COUNT; i++) {
                memory.set(posX, i, Math.random() * width);
                memory.set(posY, i, Math.random() * height);
                memory.set(speed, i, 1 + Math.random() * 5);
                memory.set(brightness, i, 80 + Math.random() * 175);
            }
        }

        function resetStar(i) {
                memory.set(posX, i, Math.random() * width);
                memory.set(posY, i, 0);
                memory.set(speed, i, 1 + Math.random() * 5);
                memory.set(brightness, i, 80 + Math.random() * 175);
        }

        function update() {
            for (let i = 0; i < STAR_COUNT; i++) {
                let y = memory.get(posY, i);
                const $speed = memory.get(speed, i);

                y += $speed;

                if (y >= height)
                    resetStar(i);
                else
                    memory.set(posY, i, y);
            }
        }

        function render() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < STAR_COUNT; i++) {

                const $x = memory.get(posX, i);
                const $y = memory.get(posY, i);
                const $speed = memory.get(speed, i);
                const $brightness = memory.get(brightness, i);

                

                if ($speed  >= 4) {
                    const gradient = ctx.createLinearGradient($x, $y - $speed * 2, $x, $y);
                    gradient.addColorStop(0, `rgba(0,0,0,0)`);
                    gradient.addColorStop(1, `rgb(${$brightness},${$brightness},${$brightness})`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect($x, $y - $speed  * 2, 1, $speed  * 2);
                    ctx.fillStyle = `rgb(${$brightness},${$brightness},${$brightness})`;
                    ctx.fillRect($x, $y, 2, 2);
                } else {
                    ctx.fillStyle = `rgb(${$brightness},${$brightness},${$brightness})`;
                    ctx.fillRect($x, $y, 1, 1);
                }
            }
        }

        function frame() {
            update();
            render();
            requestAnimationFrame(frame);
        }

        window.addEventListener("resize", resize);

        resize();
        frame();
    </script>
</body>

</html>
