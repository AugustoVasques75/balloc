<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ImageDataAdapter · WebGPU sprite animation</title>
    <style>
        :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #10151d; color: #e6edf3; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        main { width: min(900px, 100%); }
        h1 { margin: 0 0 6px; font-size: 1.35rem; }
        p { margin: 0 0 18px; color: #9eacbb; }
        canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #182230; border: 1px solid #344457; border-radius: 8px; image-rendering: pixelated; }
        footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: #9eacbb; font-size: .85rem; }
        #status { color: #8bd5a8; }
        kbd { padding: 2px 6px; border: 1px solid #536273; border-radius: 4px; color: #e6edf3; }
    </style>
</head>
<body>
<main>
    <h1>ImageDataAdapter · WebGPU sprite animation</h1>
    <p>Arrow keys or WASD move the textured quad. The animation selects a different sprite frame while moving.</p>
    <canvas id="screen" width="960" height="540"></canvas>
    <footer>
        <span><kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> / WASD</span>
        <span id="status">Initializing WebGPU…</span>
    </footer>
</main>
<script src="../../../balloc/src/pt/balloc.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
